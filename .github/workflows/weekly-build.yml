name: Weekly Pages Build

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Trigger Pages Build
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/bmadden-arch/bmadden-arch.github.io/pages/builds
